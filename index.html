<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>IMO - 協力型価値観共有パーティーゲーム</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#f472b6">
  <link rel="manifest" href='data:application/manifest+json,{"name":"IMO パーティーゲーム","short_name":"IMO","start_url":".","display":"standalone","background_color":"#fdf4ff","theme_color":"#f472b6"}'>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800;900&display=swap" rel="stylesheet">
  
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- SortableJS -->
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
  
  <style>
    body {
      overflow-x: hidden;
    }
    #root {
      overflow-x: hidden;
      max-width: 100vw;
      min-height: 100vh;
    }
    
    input[type="text"] {
      -webkit-user-select: text !important;
      user-select: text !important;
      touch-action: auto !important;
    }

    body {
      font-family: 'M PLUS Rounded 1c', sans-serif;
      background: radial-gradient(circle at top left, #fdf4ff, #e0e7ff, #fce7f3);
      background-attachment: fixed;
      color: #334155;
      touch-action: manipulation;
    }
    .party-shadow {
      box-shadow: 0 10px 25px -5px rgba(192, 132, 252, 0.3), 0 8px 10px -6px rgba(192, 132, 252, 0.2);
    }
    .text-outline {
      text-shadow: 2px 2px 0 #fff, -2px 2px 0 #fff, 2px -2px 0 #fff, -2px -2px 0 #fff, 0 4px 6px rgba(0,0,0,0.1);
    }
    html {
      scroll-behavior: smooth;
    }
    .drag-ghost {
      opacity: 0.3;
      background: #e9d5ff !important;
      border: 2px dashed #c084fc !important;
    }
    /* ドラッグ中に指についてくる要素のスタイル */
    .drag-fallback {
      opacity: 0.98 !important;
      background: white !important;
      /* 座標ズレの原因になるため transform(scale, rotate) は使用せず、強い影とボーダーで持ち上げ感を表現 */
      box-shadow: 0 20px 40px rgba(0,0,0,0.25), 0 0 0 2px #c084fc !important; 
      will-change: transform;
      border-radius: 1rem !important;
      z-index: 9999 !important;
      pointer-events: none !important;
      cursor: grabbing !important;
      margin: 0 !important; /* マージンによるズレも念のため防止 */
    }
    .drag-handle {
      -webkit-touch-callout: none !important;
      -webkit-user-select: none !important;
      user-select: none !important;
      touch-action: none;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- Icons ---
    const UsersIcon = ({ className = "w-6 h-6" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
        <circle cx="9" cy="7" r="4"></circle>
        <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
      </svg>
    );

    const SparklesIcon = ({ className = "w-6 h-6" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"></path>
      </svg>
    );
    
    const RefreshIcon = ({ className = "w-6 h-6" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
        <path d="M3 3v5h5"></path>
      </svg>
    );

    const CutePotatoIcon = ({ className = "w-16 h-16" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" className={className}>
        <path d="M 40 20 Q 45 10 40 5" fill="none" stroke="#ffffff" strokeWidth="3" strokeLinecap="round" opacity="0.8" />
        <path d="M 60 25 Q 65 15 60 10" fill="none" stroke="#ffffff" strokeWidth="3" strokeLinecap="round" opacity="0.8" />
        <path d="M85 25 C 75 10, 45 15, 25 35 C 10 55, 15 80, 30 90 C 45 100, 75 90, 90 70 C 100 50, 95 35, 85 25 Z" fill="#9f1239" />
        <path d="M 70 20 C 65 35, 80 45, 90 35 C 85 20, 75 15, 70 20 Z" fill="#fde047" opacity="0.9" />
        <circle cx="25" cy="45" r="3" fill="#4c0519" opacity="0.6"/>
        <circle cx="35" cy="75" r="2.5" fill="#4c0519" opacity="0.6"/>
        <circle cx="50" cy="25" r="2" fill="#4c0519" opacity="0.6"/>
        <circle cx="45" cy="55" r="4" fill="#ffffff" />
        <circle cx="65" cy="50" r="4" fill="#ffffff" />
        <circle cx="45" cy="55" r="2" fill="#000000" />
        <circle cx="65" cy="50" r="2" fill="#000000" />
        <path d="M 50 65 Q 55 70 60 62" fill="none" stroke="#ffffff" strokeWidth="3" strokeLinecap="round" />
        <circle cx="38" cy="60" r="3" fill="#fda4af" opacity="0.8"/>
        <circle cx="72" cy="55" r="3" fill="#fda4af" opacity="0.8"/>
      </svg>
    );

    // --- Themes ---
    const THEMES = [
      { text: "人気のある食べ物", example: "例: セロリ 〜 焼肉", adult: false },
      { text: "無人島に持っていきたいもの", example: "例: 砂 〜 ナイフ", adult: false },
      { text: "子供に人気の職業", example: "例: 悪役 〜 ユーチューバー", adult: false },
      { text: "強そうな動物", example: "例: アリ 〜 ライオン", adult: false },
      { text: "テンションが上がる出来事", example: "例: 小指をぶつける 〜 宝くじ当選", adult: false },
      { text: "デートで行きたい場所", example: "例: 近所の空き地 〜 夜景レストラン", adult: false },
      { text: "怖いもの", example: "例: マシュマロ 〜 幽霊", adult: false },
      { text: "かっこいい漢字", example: "例: 凸 〜 龍", adult: false },
      { text: "寿司のネタ", example: "例: ガリ 〜 大トロ", adult: false },
      { text: "嫌いな家事", example: "例: ゴミ出し 〜 水回りの掃除", adult: false },
      { text: "休日の過ごし方", example: "例: ずっと寝る 〜 テーマパーク", adult: false },
      { text: "浮気の境界線", example: "例: 挨拶 〜 お泊り", adult: true },
      { text: "恋人に求める年収", example: "例: 0円 〜 1億円", adult: true },
      { text: "付き合ってから最初にしてほしいこと", example: "例: 握手 〜 同棲", adult: true },
      { text: "恋人の過去の交際人数", example: "例: 0人 〜 100人以上", adult: true },
      { text: "許せるギャンブルの金額", example: "例: 1円も無理 〜 全財産", adult: true },
      { text: "自分が思うフェチの深さ", example: "例: ほぼなし 〜 深淵", adult: true },
      { text: "一夜限りの関係の是非", example: "例: 絶対ダメ 〜 自由", adult: true },
      { text: "恋人のスマホを勝手に見る", example: "例: 犯罪レベル 〜 全然OK", adult: true },
      { text: "一目惚れのしやすさ", example: "例: 全くない 〜 3秒で好き", adult: true }
    ];

    function App() {
      const [phase, setPhase] = useState('setup');
      const [isAdultMode, setIsAdultMode] = useState(false);
      const [players, setPlayers] = useState(() => {
        const saved = localStorage.getItem('imo_party_players');
        if (saved) {
          try {
            return JSON.parse(saved).map(p => ({ ...p, number: null, played: false, answer: '', isOpen: false }));
          } catch (e) { console.error(e); }
        }
        return [
          { id: 1, name: 'プレイヤー1', number: null, played: false, answer: '', isOpen: false },
          { id: 2, name: 'プレイヤー2', number: null, played: false, answer: '', isOpen: false },
          { id: 3, name: 'プレイヤー3', number: null, played: false, answer: '', isOpen: false }
        ];
      });
      
      const [theme, setTheme] = useState({ text: '', example: '' });
      const [revealIndex, setRevealIndex] = useState(0);
      const [isNumberVisible, setIsNumberVisible] = useState(false);
      const [hasViewedCurrent, setHasViewedCurrent] = useState(false);
      const [playedSequence, setPlayedSequence] = useState([]);
      const [recheckState, setRecheckState] = useState(null);
      const [isRecheckVisible, setIsRecheckVisible] = useState(false);
      const [confirmOpenId, setConfirmOpenId] = useState(null);

      const sortableRef = useRef(null);
      const isDragging = useRef(false);

      useEffect(() => {
        localStorage.setItem('imo_party_players', JSON.stringify(players.map(p => ({ id: p.id, name: p.name }))));
      }, [players]);

      // SortableJSの初期化（超スムーズ・チューニング版）
      useEffect(() => {
        let sortableInstance = null;
        if (phase === 'play' && playedSequence.length > 0 && sortableRef.current && window.Sortable) {
          sortableInstance = window.Sortable.create(sortableRef.current, {
            handle: '.drag-handle',
            animation: 250, // アニメーションを長くして滑らかに
            easing: "cubic-bezier(0.2, 0, 0, 1)", // 減速しながら定位置に収まる自然な動き
            delay: 0, // ★遅延をゼロにし、タップした瞬間にドラッグ開始
            fallbackTolerance: 3,
            forceFallback: true, 
            fallbackOnBody: true, // 画面全体での追従性を向上
            fallbackClass: 'drag-fallback',
            ghostClass: 'drag-ghost',
            scroll: true, 
            scrollSensitivity: 80, // スクロール感度を上げて端っこでスムーズにスクロールさせる
            scrollSpeed: 15,
            onStart: () => { isDragging.current = true; },
            onEnd: (evt) => {
              setTimeout(() => { isDragging.current = false; }, 50);
              const { oldIndex, newIndex, item, from } = evt;
              if (oldIndex === newIndex || oldIndex === undefined || newIndex === undefined) return;
              
              if (oldIndex < newIndex) from.insertBefore(item, from.children[oldIndex]);
              else from.insertBefore(item, from.children[oldIndex + 1] || null);

              setPlayedSequence(prev => {
                const newSeq = [...prev];
                const [movedItem] = newSeq.splice(oldIndex, 1);
                newSeq.splice(newIndex, 0, movedItem);
                return newSeq;
              });
            }
          });
        }
        return () => sortableInstance?.destroy();
      }, [phase, playedSequence.length]);

      const startGame = () => {
        const deck = Array.from({ length: 100 }, (_, i) => i + 1).sort(() => Math.random() - 0.5);
        const filteredThemes = THEMES.filter(t => isAdultMode || !t.adult);
        const newTheme = filteredThemes[Math.floor(Math.random() * filteredThemes.length)];
        
        setPlayers(players.map((p, i) => ({ ...p, number: deck[i], played: false, answer: '', isOpen: false })));
        setTheme(newTheme);
        setRevealIndex(0);
        setIsNumberVisible(false);
        setHasViewedCurrent(false);
        setPlayedSequence([]);
        setPhase('reveal');
        window.scrollTo(0, 0);
      };

      const changeTheme = () => {
        const filteredThemes = THEMES.filter(t => isAdultMode || !t.adult);
        let newTheme = theme;
        while(newTheme.text === theme.text) {
          newTheme = filteredThemes[Math.floor(Math.random() * filteredThemes.length)];
        }
        setTheme(newTheme);
      };

      const handlePlayCard = (playerId) => {
        setPlayedSequence([...playedSequence, playerId]);
        setPlayers(players.map(pl => pl.id === playerId ? { ...pl, played: true } : pl));
      };

      const handleCardOpenClick = (id) => {
        if (isDragging.current) return;
        const p = players.find(player => player.id === id);
        if (p.isOpen) setPlayers(players.map(pl => pl.id === id ? { ...pl, isOpen: false } : pl));
        else setConfirmOpenId(id);
      };

      // --- Views ---

      const renderSetup = () => (
        <div className="flex flex-col items-center max-w-md mx-auto w-full space-y-6 pb-12 pt-8">
          <div className="text-center space-y-2 flex flex-col items-center">
            <div className="flex items-center justify-center gap-1 mb-1">
              <CutePotatoIcon className="w-16 h-16 drop-shadow-md transform -rotate-12" />
              <h1 className="text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-pink-500 via-purple-500 to-indigo-500 tracking-wider text-outline">IMO</h1>
            </div>
            <p className="text-purple-600 font-bold bg-white/50 inline-block px-4 py-1 rounded-full text-sm party-shadow">協力型価値観共有ゲーム</p>
          </div>

          <div className="w-full bg-white/90 backdrop-blur-sm p-6 rounded-[2rem] party-shadow border-2 border-white space-y-5">
            <h2 className="text-lg font-black text-indigo-900 flex items-center gap-2">
              <UsersIcon className="w-6 h-6 text-pink-500" /> 参加プレイヤー
            </h2>
            <div className="relative space-y-3 pl-1 pt-2 pb-4">
              <div className="absolute left-8 top-0 bottom-0 w-2 bg-gradient-to-b from-lime-400 to-green-500 z-0 rounded-full shadow-inner border border-green-600/20"></div>
              {players.map((p, index) => (
                <div key={p.id} className="relative z-10 flex items-center gap-2 bg-white/95 p-2 rounded-2xl border border-slate-200 shadow-sm ml-1 animate-in fade-in slide-in-from-left-4 duration-300">
                  <div className="relative w-10 h-10 flex items-center justify-center shrink-0 transform -rotate-6">
                    <svg viewBox="0 0 100 100" className="absolute inset-0 w-full h-full text-rose-800 drop-shadow-sm">
                      <path fill="currentColor" d="M85 25 C 75 10, 45 15, 25 35 C 10 55, 15 80, 30 90 C 45 100, 75 90, 90 70 C 100 50, 95 35, 85 25 Z" />
                    </svg>
                    <span className="relative z-10 text-white font-black text-lg">{index + 1}</span>
                  </div>
                  <input type="text" value={p.name} onChange={(e) => setPlayers(players.map(pl => pl.id === p.id ? { ...pl, name: e.target.value } : pl))} className="flex-1 w-full bg-transparent px-2 py-2 outline-none font-bold text-slate-700 min-w-0" placeholder="なまえ" />
                  {players.length > 2 && (
                    <button 
                      onClick={() => setPlayers(players.filter(pl => pl.id !== p.id))} 
                      className="shrink-0 w-10 h-10 flex items-center justify-center text-rose-300 hover:text-rose-500 hover:bg-rose-50 rounded-full transition-colors"
                    >
                      <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                  )}
                </div>
              ))}
              <button onClick={() => setPlayers([...players, { id: Date.now(), name: `プレイヤー${players.length + 1}`, number: null, played: false, answer: '', isOpen: false }])} className="relative z-10 w-full py-3 mt-2 border-2 border-dashed border-purple-200 text-purple-400 rounded-2xl font-bold text-sm bg-white/50 active:scale-95 transition-transform">+ プレイヤーを追加する</button>
            </div>
            
            <div className="pt-4 border-t border-purple-100">
              <label className="flex items-center justify-between cursor-pointer group">
                <div className="flex flex-col">
                  <span className="text-sm font-black text-indigo-900">アダルトモード (18歳以上)</span>
                  <span className="text-[10px] font-bold text-slate-400">少し刺激的なお題が混ざります</span>
                </div>
                <div className="relative">
                  <input type="checkbox" checked={isAdultMode} onChange={(e) => setIsAdultMode(e.target.checked)} className="sr-only peer" />
                  <div className="w-11 h-6 bg-slate-200 rounded-full peer peer-checked:after:translate-x-full peer-checked:bg-pink-500 after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all"></div>
                </div>
              </label>
            </div>
          </div>

          <button onClick={startGame} className="w-full bg-gradient-to-r from-pink-500 to-orange-400 text-white font-black py-5 rounded-[2rem] party-shadow text-2xl border-b-4 border-orange-600 active:border-b-0 active:mt-1 transform transition-all active:scale-95">
            ゲームスタート！
          </button>
        </div>
      );

      const renderReveal = () => (
        <div className="flex flex-col items-center justify-center min-h-screen max-w-md mx-auto w-full space-y-8 py-10">
          <div className="text-center space-y-4">
            <div className="inline-block px-5 py-2 bg-white/80 backdrop-blur-sm text-purple-700 rounded-full text-sm font-black party-shadow">
              {revealIndex + 1} / {players.length} 人目
            </div>
            <h2 className="text-4xl font-black text-indigo-900"><span className="text-pink-600">{players[revealIndex].name}</span> の番</h2>
            <p className="text-purple-600 font-bold bg-white/50 px-4 py-1 rounded-full text-sm">他人に隠して数字を確認してね</p>
          </div>
          <div onClick={() => { setIsNumberVisible(!isNumberVisible); setHasViewedCurrent(true); }} className={`w-64 h-80 rounded-[2.5rem] shadow-2xl flex flex-col items-center justify-center cursor-pointer transition-all duration-500 transform border-4 ${isNumberVisible ? 'bg-gradient-to-br from-indigo-500 to-pink-500 border-white' : 'bg-white border-dashed border-purple-300'}`}>
            {isNumberVisible ? (
              <div className="text-center text-white space-y-2">
                <span className="text-sm font-black bg-black/20 px-4 py-1 rounded-full">あなたの数字</span>
                <div className="text-9xl font-black">{players[revealIndex].number}</div>
              </div>
            ) : (
              <div className="text-center text-purple-400 font-black text-xl">タップして確認</div>
            )}
          </div>
          <button onClick={() => { if (revealIndex < players.length - 1) { setRevealIndex(revealIndex + 1); setIsNumberVisible(false); setHasViewedCurrent(false); } else { setPhase('play'); window.scrollTo(0, 0); } }} disabled={!hasViewedCurrent} className={`w-full font-black py-5 rounded-[2rem] transition-all text-xl ${hasViewedCurrent ? 'bg-indigo-900 text-white party-shadow active:scale-95' : 'bg-white/50 text-slate-400 cursor-not-allowed'}`}>
            {revealIndex < players.length - 1 ? '次の人へ' : '話し合いへ進む'}
          </button>
        </div>
      );

      const renderPlay = () => (
        <div className="flex flex-col max-w-md mx-auto w-full space-y-4 py-6 px-1">
          {/* Theme Banner */}
          <div className="bg-gradient-to-r from-pink-500 via-purple-500 to-indigo-500 rounded-[2rem] p-5 party-shadow text-white flex items-center justify-between sticky top-4 z-30">
            <div className="flex-1">
              <span className="text-[10px] font-black text-pink-200 uppercase tracking-widest bg-black/20 px-2 py-0.5 rounded-full">お題</span>
              <h2 className="text-xl font-black mt-1 leading-tight">{theme.text}</h2>
            </div>
            <button onClick={changeTheme} className="shrink-0 bg-white/20 p-3 rounded-xl ml-2 active:scale-90 transition-transform"><RefreshIcon /></button>
          </div>

          {/* Played Cards Section */}
          <div className="bg-white/80 backdrop-blur-md rounded-[2rem] p-5 party-shadow border-2 border-white space-y-4 min-h-[200px]">
            <div className="text-center">
              <h3 className="text-xs font-black text-indigo-300 tracking-widest">場に出た回答（小さい順に並べ替え）</h3>
              {playedSequence.length > 1 && (
                <p className="text-[10px] font-bold text-pink-400 mt-1 bg-pink-50 inline-block px-3 py-0.5 rounded-full">※一番右の ≡ をドラッグして並び替え</p>
              )}
            </div>
            
            {playedSequence.length === 0 ? (
              <div className="py-8 flex flex-col items-center justify-center text-slate-400 opacity-60 italic text-sm font-bold">
                まだ誰も場に出していません
              </div>
            ) : (
              <div ref={sortableRef} className="space-y-3 relative">
                {playedSequence.map((id, index) => {
                  const p = players.find(pl => pl.id === id);
                  return (
                    <div key={p.id} className={`flex items-center p-3 rounded-2xl border-2 transition-all relative ${p.isOpen ? 'bg-white border-indigo-300 shadow-lg scale-[1.02] z-10' : 'bg-gradient-to-br from-yellow-50 to-amber-100 border-yellow-300 shadow-sm'}`}>
                      <div className="w-8 text-center shrink-0 pr-2 select-none font-black text-xl text-amber-500">{index + 1}</div>
                      <div className={`flex-1 px-2 border-l-2 ml-1 pl-2 flex flex-col min-w-0 ${p.isOpen ? 'border-indigo-100' : 'border-amber-300'}`}>
                        <div className="font-black text-[11px] text-amber-800 mb-1">{p.name}</div>
                        {p.isOpen ? (
                          <div className="text-xs font-bold px-2 py-2 rounded-lg bg-indigo-50 text-slate-600 border border-indigo-100 select-none">{p.answer || '(無言)'}</div>
                        ) : (
                          <input 
                            type="text"
                            value={p.answer} 
                            onChange={(e) => setPlayers(players.map(pl => pl.id === p.id ? { ...pl, answer: e.target.value } : pl))} 
                            placeholder={theme.example} 
                            className="text-xs font-bold px-2 py-2 rounded-lg border bg-white/70 text-amber-900 border-amber-300/50 outline-none w-full focus:bg-white transition-colors" 
                          />
                        )}
                      </div>
                      <div onClick={() => handleCardOpenClick(p.id)} className={`shrink-0 text-center w-14 flex flex-col items-center justify-center cursor-pointer transition-transform active:scale-90 select-none ${p.isOpen ? '' : 'bg-white/50 border border-amber-200 rounded-xl py-1 ml-1 shadow-sm'}`}>
                        {p.isOpen ? <span className="text-3xl font-black text-indigo-600">{p.number}</span> : <div className="flex flex-col items-center"><span className="text-2xl font-black text-amber-400">?</span><span className="text-[7px] font-bold text-amber-500">公開する</span></div>}
                      </div>
                      <div 
                        className="drag-handle shrink-0 pl-1 pr-1 text-amber-300 cursor-grab active:cursor-grabbing hover:text-amber-500 transition-colors"
                        onContextMenu={(e) => { e.preventDefault(); e.stopPropagation(); }}
                      >
                        <svg className="w-8 h-8 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M4 8h16M4 16h16"></path></svg>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>

          {/* Action Area */}
          <div className="bg-white/80 rounded-[2rem] p-6 party-shadow border-2 border-white space-y-6">
            {playedSequence.length === players.length ? (
              <div className="py-4 flex flex-col items-center justify-center space-y-4 animate-in fade-in zoom-in-95 duration-500">
                <p className="font-black text-indigo-900 text-lg">芋づる準備完了！</p>
                <button onClick={() => { setPhase('result'); window.scrollTo(0, 0); }} className="w-full py-5 bg-gradient-to-r from-pink-500 to-orange-400 text-white font-black rounded-3xl shadow-lg text-2xl active:scale-95 transition-transform border-b-4 border-orange-600 active:border-b-0">答え合わせ！</button>
              </div>
            ) : (
              <div className="space-y-4">
                <h3 className="text-sm font-black text-pink-500 text-center bg-pink-50 py-1.5 rounded-full">まだ手札を持っている人</h3>
                {players.filter(p => !p.played).map(p => (
                  <div key={p.id} className="bg-slate-50 p-4 rounded-2xl flex flex-col gap-3 border border-slate-200 shadow-inner">
                    <div className="flex justify-between items-center">
                      <span className="font-black text-indigo-900">{p.name}</span>
                      <button onClick={() => handlePlayCard(p.id)} className="py-2 px-5 bg-indigo-600 text-white font-black rounded-full text-xs active:scale-90 shadow-md transition-all">場に出す</button>
                    </div>
                    <input 
                      type="text"
                      value={p.answer} 
                      onChange={(e) => setPlayers(players.map(pl => pl.id === p.id ? { ...pl, answer: e.target.value } : pl))} 
                      placeholder={theme.example} 
                      className="bg-white border-2 border-slate-100 rounded-xl px-4 py-3 text-sm font-bold text-slate-700 outline-none focus:border-pink-300 transition-colors" 
                    />
                  </div>
                ))}
              </div>
            )}
          </div>
          
          <button onClick={() => setRecheckState('select')} className="w-full py-4 text-purple-600 font-black rounded-2xl bg-white/60 party-shadow border-2 border-white text-sm active:scale-95 transition-transform">👀 自分の数字を確認する</button>

          {/* Confirm Open Modal */}
          {confirmOpenId && (
            <div className="fixed inset-0 bg-indigo-900/60 flex items-center justify-center z-50 p-6 backdrop-blur-sm">
              <div className="bg-white rounded-[2.5rem] p-8 max-w-xs w-full party-shadow text-center space-y-6">
                <h3 className="font-black text-slate-800 text-xl leading-tight">ユーザー名：<br/><span className="text-pink-500 text-2xl">{players.find(p => p.id === confirmOpenId)?.name}</span> の<br/>数字を公開します。</h3>
                <p className="text-slate-500 font-bold">本当によろしいですか？</p>
                <div className="flex gap-3">
                  <button onClick={() => setConfirmOpenId(null)} className="flex-1 py-4 bg-slate-100 text-slate-500 font-black rounded-2xl">いいえ</button>
                  <button onClick={() => { setPlayers(players.map(pl => pl.id === confirmOpenId ? { ...pl, isOpen: true } : pl)); setConfirmOpenId(null); }} className="flex-1 py-4 bg-pink-500 text-white font-black rounded-2xl shadow-md">はい（公開）</button>
                </div>
              </div>
            </div>
          )}

          {/* Recheck select Modal */}
          {recheckState === 'select' && (
            <div className="fixed inset-0 bg-white/95 z-50 flex flex-col items-center justify-center p-8 backdrop-blur-md">
              <h3 className="text-2xl font-black text-indigo-900 mb-8 bg-indigo-50 px-8 py-2 rounded-full">誰が確認しますか？</h3>
              <div className="w-full max-w-xs space-y-3 overflow-y-auto max-h-[60vh] px-2 pb-6">
                {players.map(p => <button key={p.id} onClick={() => { setRecheckState(p); setIsRecheckVisible(false); }} className="w-full py-4 bg-white border-2 border-indigo-100 text-indigo-700 font-black rounded-2xl hover:bg-pink-50 party-shadow transition-all text-lg">{p.name}</button>)}
              </div>
              <button onClick={() => setRecheckState(null)} className="mt-4 text-slate-400 font-bold text-lg px-8 py-4">閉じる</button>
            </div>
          )}

          {/* Recheck Card View */}
          {recheckState && recheckState !== 'select' && (
            <div className="fixed inset-0 bg-slate-50 z-50 flex flex-col items-center justify-center p-6">
              <h2 className="text-4xl font-black text-indigo-900 mb-2">{recheckState.name} の確認</h2>
              <p className="text-purple-600 font-bold mb-10">周りに見られないように！</p>
              <div onClick={() => setIsRecheckVisible(!isRecheckVisible)} className={`w-64 h-80 rounded-[2.5rem] shadow-2xl flex flex-col items-center justify-center cursor-pointer transition-all duration-500 transform border-4 ${isRecheckVisible ? 'bg-gradient-to-br from-indigo-500 to-pink-500 border-white' : 'bg-white border-dashed border-purple-300'}`}>
                {isRecheckVisible ? <div className="text-center text-white"><span className="text-sm font-black opacity-80">数字</span><div className="text-9xl font-black">{recheckState.number}</div></div> : <div className="text-purple-400 font-black text-xl">タップして見る</div>}
              </div>
              <button onClick={() => { setRecheckState(null); setIsRecheckVisible(false); }} className="mt-12 w-full max-w-xs py-5 bg-indigo-900 text-white font-black rounded-3xl text-xl shadow-lg active:scale-95 transition-transform">確認した</button>
            </div>
          )}
        </div>
      );

      const renderResult = () => {
        let isWin = true;
        let prev = -1;
        const resultList = playedSequence.map((id, i) => {
          const p = players.find(pl => pl.id === id);
          const mistake = p.number <= prev;
          if (mistake) isWin = false;
          prev = p.number;
          return { ...p, mistake, order: i + 1 };
        });

        return (
          <div className="flex flex-col items-center max-w-md mx-auto w-full space-y-6 py-10 px-2 min-h-screen">
            <div className="text-center w-full bg-white/90 p-8 rounded-[2.5rem] party-shadow border-2 border-white relative overflow-hidden animate-in zoom-in-95 duration-500">
              <div className={`w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-4 text-white text-3xl shadow-inner ${isWin ? 'bg-yellow-400' : 'bg-rose-500'}`}>
                {isWin ? '✨' : '⚠️'}
              </div>
              <h1 className={`text-4xl font-black ${isWin ? 'text-amber-500' : 'text-rose-500'} tracking-wider`}>{isWin ? 'SUCCESS!!' : 'FAILURE'}</h1>
              <p className="text-slate-500 font-bold text-sm mt-2">{isWin ? '完璧に芋づるが繋がった！' : '順番が逆転していました...'}</p>
              <div className="bg-indigo-50 p-4 rounded-2xl mt-6 border border-indigo-100">
                <span className="text-[11px] font-black text-indigo-400 bg-white px-3 py-1 rounded-full inline-block mb-2">お題</span>
                <div className="text-indigo-900 font-black text-lg leading-tight">{theme.text}</div>
              </div>
            </div>

            <div className="w-full bg-white/90 rounded-[2.5rem] p-6 party-shadow border-2 border-white space-y-4">
              <h3 className="text-xs font-black text-pink-500 text-center bg-pink-50 py-2 rounded-full tracking-widest">最終結果（数字オープン）</h3>
              <div className="space-y-3">
                {resultList.map(p => (
                  <div key={p.id} className={`flex items-center p-4 rounded-2xl border-2 transition-all ${p.mistake ? 'bg-rose-50 border-rose-300 scale-[0.98]' : 'bg-slate-50 border-slate-200'}`}>
                    <div className="w-8 font-black text-slate-400 text-lg">{p.order}</div>
                    <div className="flex-1 px-4 border-l-2 border-slate-200 ml-2 overflow-hidden">
                      <div className="font-black text-indigo-900 text-base truncate flex items-center gap-2">{p.name} {p.mistake && <span className="text-rose-500 animate-pulse">⚠️</span>}</div>
                      <div className="text-xs font-bold text-slate-500 truncate mt-0.5">{p.answer || '(無言)'}</div>
                    </div>
                    <div className={`text-3xl font-black shrink-0 ml-2 ${p.mistake ? 'text-rose-600' : 'text-indigo-600'}`}>{p.number}</div>
                  </div>
                ))}
              </div>
            </div>
            <button onClick={() => { setPhase('setup'); window.scrollTo(0, 0); }} className="w-full bg-indigo-900 text-white font-black py-6 rounded-[2.5rem] shadow-xl text-2xl active:scale-95 transition-transform">もう一度遊ぶ</button>
          </div>
        );
      };

      return (
        <div className="min-h-screen px-4 pb-10">
          {phase === 'setup' && renderSetup()}
          {phase === 'reveal' && renderReveal()}
          {phase === 'play' && renderPlay()}
          {phase === 'result' && renderResult()}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
